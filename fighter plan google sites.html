<style>

*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% 0%,#25313a 0,#0b0e12 48%);color:var(--white);font:15px/1.5 system-ui,-apple-system,Segoe UI,Arial,sans-serif}

.section{margin:0 0 17px}.section>label,.field label{display:block;font-size:13px;font-weight:750;margin-bottom:8px;color:#e1e7ed}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.choice{position:relative}.choice input{position:absolute;opacity:0}.choice span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:42px;padding:8px;border:1px solid var(--line);border-radius:10px;background:#121920;color:#cbd4dd;font-size:13px;cursor:pointer}.choice input:checked+span{border-color:var(--yellow);background:#3a321e;color:#ffe28b;box-shadow:inset 0 0 0 1px #f2c44355}

@media(max-width:780px){.layout{grid-template-columns:1fr}.wrap{padding-top:17px}.panel{padding:17px}}@media(max-width:420px){.fields{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.choice span{font-size:11px;padding:7px 4px}}

.langs{display:flex;gap:6px}.langs a{color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:30px;padding:5px 11px;font-size:12px}.langs a.on{border-color:var(--yellow);color:var(--yellow)}
a.btn{display:inline-block;text-align:center;text-decoration:none}.err{color:#ff9d8a;font-size:13px;margin-top:10px}.langs a:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}

.langs button{background:none;font:inherit;cursor:pointer;color:var(--muted);border:1px solid var(--line);border-radius:30px;padding:5px 11px;font-size:12px}.langs button.on{border-color:var(--yellow);color:var(--yellow)}.langs button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
</style></head>

sez votre sport","personal":"Informations personnelles","age":"Âge","weight":"Poids (kg)","height":"Taille (cm)","level":"Niveau","goal":"Objectif principal","equip":"Matériel disponible","reset":"RÉINITIALISER","gen":"GÉNÉRER MON PLAN","hint":"Sans IA ni abonnement. Programmes issus d'une bibliothèque. Pour un PDF, utilisez l'impression du navigateur.","plan":"02 / VOTRE PROGRAMME","emptyh":"Votre semaine commence ici.","emptyp":"Complétez votre profil puis générez votre plan.","err":"Entrez un âge (13–90), un poids (25–300 kg) et une taille (100–230 cm) valides.","footer":"FIGHTER PLAN · ENTRAÎNEZ-VOUS MIEUX CHAQUE SEMAINE","nd":"{n} jours d'entraînement"}},"UNITS":{"Arabic":[["/ side","/ جانب"],["As needed","حسب الحاجة"],["easy jog","جري خفيف"],["sec","ث"],["min","د"]],"French":[["/ side","/ côté"],["As needed","au besoin"],["easy jog","trot léger"],["sec","s"],["min","min"]]},"SP":["Boxing","Kickboxing","MMA","Bodybuilding","Fitness / Gym","Calisthenics","Running","CrossFit","Strength & Conditioning","General Fitness"],"LV":["Beginner","Intermediate","Advanced"],"GO":["Muscle gain","Fat loss","Strength","Endurance","Sport performance","General fitness"],"EQP":["Full gym","Dumbbells and basic equipment","Bodyweight only","Combat sports equipment","Outdoor / running equipment"],"OPT":{"Arabic":{"sports":["ملاكمة","كيك بوكسينغ","فنون قتالية مختلطة","كمال أجسام","لياقة / نادي","كاليسثينكس","جري","كروس فيت","قوة وتكييف","لياقة عامة"],"levels":["مبتدئ","متوسط","متقدم"],"goals":["بناء عضلات","حرق دهون","قوة","تحمل","أداء رياضي","لياقة عامة"],"equips":["نادي كامل","دمبل ومعدات بسيطة","وزن الجسم فقط","معدات رياضات قتالية","معدات خارجية / جري"]},"French":{"sports":["Boxe","Kickboxing","MMA","Musculation","Fitness / Salle","Callisthénie","Course","CrossFit","Force et conditionnement","Forme générale"],"levels":["Débutant","Intermédiaire","Avancé"],"goals":["Prise de muscle","Perte de graisse","Force","Endurance","Performance sportive","Forme générale"],"equips":["Salle com let lang="English",plan=false;
const def={days:"4",sport:"Boxing",level:"Beginner",goal:"Muscle gain",equip:"Full gym",age:"25",weight:"70",height:"180"},st={...def};
const RX={};for(const k of["BW","DB","NB"])RX[k]=D[k].map(([p,t])=>[new RegExp(p,"i"),t]);
const swap=(n,g)=>{for(const k of g)for(const [r,t] of RX[k])if(r.test(n))return t;return n};
const lvl=(s,l)=>s.replace(/^(\d+) ×/,(m,a)=>{let n=+a;if(l==="Beginner")n=n>=5?n-2:Math.max(2,n-1);else if(l==="Advanced"&&n<=4)n++;return n+" ×"});
const rst=(r,g)=>r.replace(/^(\d+) sec$/,(m,a)=>{let n=+a;if(g==="Strength"&&n>=60)n+=30;if(g==="Fat loss")n=Math.max(30,n-15);return n+" sec"});
const tr=x=>(D.EX[lang]||{})[x]||x,un=x=>(D.UNITS[lang]||[]).reduce((a,[p,q])=>a.split(p).join(q),x);
const lab=(k,vals,x)=>D.OPT[lang]?D.OPT[lang][k][vals.indexOf(x)]:x,labs=(k,vals)=>D.OPT[lang]?D.OPT[lang][k]:vals;
const radios=(n,v,l,c)=>`<div class="grid ${c}">`+v.map((x,i)=>`<label class="choice"><input type="radio" name="${n}" value="${x}" ${st[n]==x?"checked":""}><span>${l[i]}</span></label>`).join("")+"</div>";
const sel=(n,v,l)=>`<select name="${n}">`+v.map((x,i)=>`<option value="${x}" ${st[n]==x?"selected":""}>${l[i]}</option>`).join("")+"</select>";
const num=(n,l,a,b)=>`<div class="field"><label>${l}</label><input name="${n}" type="number" min="${a}" max="${b}" value="${st[n]}" required></div>`;
function result(){
 const t=D.L[lang],f=D.FORM[lang],s=st,days=+s.days,bank=D.LIB[s.sport]||D.LIB["General Fitness"],m=bank.length-1;
 let order=Array.from({length:days},(_,i)=>bank[i%bank.length]);
 if(days==2)order=[bank[0],bank[Math.min(2,m)]];if(days==3)order=[bank[0],bank[Math.min(1,m)],bank[Math.min(2,m)]];
 const g=D.EQ[s.equip]||[],alerts=[t.goals[s.goal]];if(days==7)alerts.push(t.seven);if(+s.age<18)alerts.push(t.teen);
 const sp=lab("sports",D.SP,s.sport),title={English:"Your "+sp+" weekly plan",Arabic:"برنامجك الأسبوعي — "+sp,French:"Votre programme hebdomadaire — "+sp}[lang];
 const sum=[f.nd.replace("{n}",days),lab("levels",D.LV,s.level),lab("goals",D.GO,s.goal),+s.age+" "+t.yrs,+s.weight+" "+t.kg,+s.height+" "+t.cm,lab("equips",D.EQP,s.equip)];
 let out="",k=0;
 for(let i=0;i<7;i++){
  if(i<days){
   const [name,lines]=order[k++],seen=new Set(),rows=[];
   lines.forEach(l=>{let [n,a,r]=l.split("|");n=swap(n,g);if(!seen.has(n)){seen.add(n);rows.push([n,lvl(a,s.level),rst(r,s.goal)])}});
   if(D.FIN[s.goal]){let [n,a,r]=D.FIN[s.goal].split("|");rows.push([n,lvl(a,s.level),r])}
   out+=`<details class="day" ${i==0?"open":""}><summary><span>${t.d[i]} — ${tr(name)}</span><em>${t.train}</em></summary><div class="daybody"><div class="warm">${t.warm}</div>${rows.map(([n,a,r])=>`<div class="exercise"><div><b>${tr(n)}</b><br><small>${un(a)}</small></div><small>${t.restL}: ${un(r)}</small></div>`).join("")}<div class="daynote">${t.cool}</div></div></details>`;
  }else out+=`<details class="day"><summary><span>${t.d[i]} — ${t.rec}</span><em>${t.rest}</em></summary><div class="daybody"><div class="daynote">${t.restNote}</div></div></details>`;
 }
 return `<div class="result show"><div class="resulthead"><h2>${title}</h2><span class="status">${t.ready}</span></div><div class="summary">${sum.map(x=>`<span>${x}</span>`).join("")}</div>${alerts.map(a=>`<div class="alert">${a}</div>`).join("")}${out}<div class="actions"><button class="btn secondary" type="button" id="print">${t.print}</button></div><p class="safety">${t.safety}</p></div>`;
}
function paint(){
 const f=D.FORM[lang];document.documentElement.dir=lang==="Arabic"?"rtl":"ltr";
 $("langs").innerHTML=Object.entries({English:"EN",Arabic:"العربية",French:"FR"}).map(([c,n])=>`<button type="button" class="${c==lang?"on":""}" data-l="${c}">${n}</button>`).join("");
 $("hero").innerHTML=`<div class="eyebrow">${f.eyebrow}</div><h1>${f.h1a}<br><span>${f.h1b}</span></h1><p>${f.intro}</p>`;
 $("form").innerHTML=`<h2>${f.profile}</h2><div class="section"><label>${f.days}</label>${radios("days",["2","3","4","5","6","7"],["2","3","4","5","6","7"],"three")}</div><div class="section"><label>${f.sport}</label>${sel("sport",D.SP,labs("sports",D.SP))}</div><div class="section"><label>${f.personal}</label><div class="fields">${num("age",f.age,13,90)}${num("weight",f.weight,25,300)}${num("height",f.height,100,230)}</div></div><div class="section"><label>${f.level}</label>${radios("level",D.LV,labs("levels",D.LV),"three")}</div><div class="section"><label>${f.goal}</label>${radios("goal",D.GO,labs("goals",D.GO),"")}</div><div class="section"><label>${f.equip}</label>${sel("equip",D.EQP,labs("equips",D.EQP))}</div><div class="actions"><button type="reset" class="btn secondary">${f.reset}</button><button type="submit" class="btn primary">${f.gen}</button></div><p class="hint">${f.hint}</p>`;
 $("out").innerHTML=plan?result():`<div class="empty"><div class="eyebrow">${f.plan}</div><h2>${f.emptyh}</h2><p>${f.emptyp}</p></div>`;
 $("foot").textContent=f.footer;
}
$("form").addEventListener("input",e=>{if(e.target.name)st[e.target.name]=e.target.value});
$("form").addEventListener("submit",e=>{e.preventDefault();const a=+st.age,w=+st.weight,h=+st.height;if(!(a>=13&&a<=90&&w>=25&&w<=300&&h>=100&&h<=230)){alert(D.FORM[lang].err);return}plan=true;paint();$("out").scrollIntoView({behavior:"smooth"})});
$("form").addEventListener("reset",e=>{e.preventDefault();Object.assign(st,def);plan=false;paint()});
$("langs").addEventListener("click",e=>{if(e.target.dataset.l){lang=e.target.dataset.l;paint()}});
$("out").addEventListener("click",e=>{if(e.target.id==="print")window.print()});
paint();
</script></body></html>
